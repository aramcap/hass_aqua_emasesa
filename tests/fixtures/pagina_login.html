<!DOCTYPE html>
<html lang="es"><head><title>Acceso - Oficina Online</title></head>
<body>
<form id="formLogin" name="formLogin" method="post" action="/oficina-online/web/login">
  <input id="user" name="user" type="text" placeholder="Usuario" />
  <input id="password" name="password" type="password" placeholder="Contraseña" />
  <input type="hidden" name="formLogin:deviceId" value="" />
  <input type="hidden" name="formLogin:hiddenDisp" value="" />
  <button id="formLogin:btnLogin" name="formLogin:btnLogin" type="submit">Entrar</button>
  <input type="hidden" name="javax.faces.ViewState" value="stateless-login" autocomplete="off" />
</form>
</body></html>
